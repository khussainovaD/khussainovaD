<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#0d1117"/>

  <text x="600" y="132" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#shimmer)" text-anchor="middle">Dariya Khussainova</text>
  <text x="600" y="172" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Backend Software Developer</text>

  <rect x="560" y="192" width="80" height="3" rx="1.5" fill="#a855f7">
    <animate attributeName="width" values="20;80;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="580;560;580" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
